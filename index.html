<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة شوتر 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        #hud {
            position: absolute;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid #00ff00;
            border-radius: 50%;
        }

        #crosshair::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 10px;
            background: #00ff00;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #stats {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-left: 3px solid #00ff00;
        }

        #ammo {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-left: 3px solid #ff0000;
        }

        #health {
            position: absolute;
            bottom: 80px;
            right: 20px;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-left: 3px solid #00ff00;
        }

        #healthBar {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #00ff00;
            margin-top: 10px;
            overflow: hidden;
        }

        #healthFill {
            height: 100%;
            background: #00ff00;
            width: 100%;
            transition: width 0.2s;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 3px solid #ff0000;
            text-align: center;
            color: #ff0000;
            font-size: 28px;
            display: none;
            z-index: 100;
            pointer-events: auto;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #gameOver p {
            color: #00ff00;
            margin: 10px 0;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-left: 3px solid #00ff00;
            color: #00ff00;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div id="crosshair"></div>
        
        <div id="stats">
            <div>الأعداء المتبقيين: <span id="enemyCount">0</span></div>
            <div>المستوى: <span id="level">1</span></div>
            <div>القتلى: <span id="kills">0</span></div>
        </div>

        <div id="health">
            الصحة: <span id="healthValue">100</span>/100
            <div id="healthBar">
                <div id="healthFill"></div>
            </div>
        </div>

        <div id="ammo">
            الذخيرة: <span id="ammoValue">30</span>/120
        </div>

        <div id="controls">
            <div>W - للأمام | A - يسار | S - للخلف | D - يمين</div>
            <div>الفأرة - النظر | الزر الأيسر - الرمي</div>
            <div>R - إعادة تحميل | SPACE - القفز</div>
        </div>

        <div id="gameOver">
            <h1>انتهيت اللعبة</h1>
            <p id="gameOverText"></p>
            <p>اضغط F5 لإعادة تشغيل</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
